name: Build and Deploy NVUC

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode clean package -DskipTests

      - name: Find JAR
        run: |
          ls -lh target/*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvuc-jar
          path: target/*.jar
          if-no-files-found: error


  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: nvuc-jar
          path: deploy

      - name: Check downloaded JAR
        run: |
          ls -lh deploy/*.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup current JAR
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'if [ -f /opt/nvuc/nvuc-app.jar ]; then
               cp /opt/nvuc/nvuc-app.jar \
                  /opt/nvuc/nvuc-app.jar.backup;
             fi'

      - name: Upload new JAR
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            deploy/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/nvuc/nvuc-0.0.1-SNAPSHOT.jar

      - name: Restart application
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'sudo systemctl restart nvuc'

      - name: Check application
        run: |
          sleep 10

          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'sudo systemctl is-active --quiet nvuc'

      - name: Deployment successful
        run: |
          echo "NVUC deployment completed successfully."