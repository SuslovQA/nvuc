about.main-text=<p><strong>«Музыка в системе культуры: Научный вестник Уральской консерватории»</strong> – периодическое печатное издание, публикующее научные труды представителей российских консерваторий, вузов искусств.</p>\
<p>Тематика издания включает актуальные теоретические и исторические проблемы современного музыкознания, различные аспекты исполнительства, музыкального краеведения, фольклористики, духовно-музыкальной культуры, музыкальной педагогики, истории музыкального образования.</p>\
<p>Журнал издаётся с 2005 г. В 2005–2011 гг. выходил под названием «Музыка в системе культуры». С 2013 г. издаётся под названием «Музыка в системе культуры: Научный вестник Уральской консерватории». Журнал включён в Российский индекс научного цитирования (РИНЦ).</p>\
<p>С 21 февраля 2022 г. журнал включен в перечень ВАК по следующим специальностям:</p>\
<ul>\
<li>5.10.1. Теория и история культуры, искусства (искусствоведение),</li>\
<li>5.10.1. Теория и история культуры, искусства (культурология),&nbsp;</li>\
<li style="text-align: justify;">5.10.3. Виды искусства (музыкальное искусство) (искусствоведение)</li>\
</ul>\
<p>Зарегистрирован в Федеральной службе по надзору в сфере связи, информационных технологий и массовых коммуникаций.</p>\
<p>Свидетельство о регистрации средств массовой информации: ПИ № ФС 77-78783 от 30 июля 2020 г.</p>\
<p>ISSN 2658-7858</p>\
<p>Номер подписного индекса в каталоге «Урал-Пресс»: ВН018387</p>\
<p>12+</p>
