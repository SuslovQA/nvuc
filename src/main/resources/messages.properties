editorial-board.header=Редакционная коллегия
editorial-board.main-text=<p style="text-align: justify;"><strong>Мешкова</strong>&nbsp;Анна Сергеевна, главный редактор,&nbsp;кандидат искусствоведения, доцент, Уральская государственная консерватория им. М. П. Мусоргского;</p>\
<p style="text-align: justify;"><strong>Бородин</strong> Борис Борисович, доктор искусствоведения, профессор, Уральская государственная консерватория им. М. П. Мусоргского (Екатеринбург, Россия), заведующий кафедрой истории и теории исполнительского искусства;</p>\
<p style="text-align: justify;"><strong>Брагинская</strong> Наталия Александровна, кандидат искусствоведения, доцент, Санкт-Петербургская государственная консерватория им. Н. А. Римского-Корсакова (Санкт-Петербург, Россия), заведующая кафедрой истории зарубежной музыки;</p>\
<p style="text-align: justify;"><strong>Валькова</strong> Вера Борисовна, доктор искусствоведения,профессор, Российская академия музыки им. Гнесиных (Москва, Россия), профессор кафедры истории музыки;</p>\
<p style="text-align: justify;"><strong>Власова</strong> Екатерина Сергеевна, доктор искусствоведения, профессор, Московская государственная консерватория им. П. И. Чайковского (Москва, Россия), профессор кафедры истории русской музыки;</p>\
<p style="text-align: justify;"><strong>Гирфанова</strong> Марина Евгеньевна, доктор искусствоведения, профессор, Казанская государственная консерватория им. Н. Г. Жиганова, профессор кафедры теории музыки;</p>\
<p style="text-align: justify;"><strong>Городилова</strong> Марина Викторовна, кандидат искусствоведения, доцент, Уральская государственная консерватория им. М. П. Мусоргского (Екатеринбург, Россия), заведующая кафедрой теории музыки;</p>\
<p style="text-align: justify;"><strong>Денисова-Брюжман</strong> Екатерина Олеговна, кандидат искусствоведения, доктор музыкознания (Университет Sorbonnes – Paris IV), Совместное объединение художественного образования (Осер, Франция), преподаватель;</p>\
<p style="text-align: justify;"><strong>Коларова-Гидишка</strong> Эмилия Кристева, PhD, Национальная музыкальная академия им. Панчо Владигерова (София, Болгария), профессор кафедры истории музыки иэтномузыкологии;</p>\
<p style="text-align: justify;"><strong>Коробова</strong> Алла Германовна, доктор искусствоведения, Уральская государственная консерватория им. М. П. Мусоргского (Екатеринбург, Россия), профессор кафедры теории музыки;</p>\
<p style="text-align: justify;"><strong>Крылова</strong> Александра Владимировна, доктор культурологии, профессор, Ростовская государственная консерватория им. С. В. Рахманинова (Ростов-на-Дону, Россия), проректор по научной работе, заведующая кафедрой продюсерства исполнительских искусств;</p>\
<p style="text-align: justify;"><strong>Мироненко</strong> Елена Сергеевна, доктор искусствоведения и культурологии, профессор, Академия музыки, театра и изобразительных искусств (Кишинёв, Республика Молдова), заведующая секцией истории музыки на кафедре музыковедения и композиции;</p>\
<p style="text-align: justify;"><strong>Панкина</strong> Елена Валериевна, доктор искусствоведения, доцент, Уральская государственная консерватория им. М. П. Мусоргского (Екатеринбург, Россия), проректор по учебной работе, профессор кафедры истории музыки;</p>\
<p style="text-align: justify;"><strong>Серебрякова</strong> Любовь Алексеевна, кандидат искусствоведения, профессор, Уральская государственная консерватория им. М. П. Мусоргского (Екатеринбург, Россия), заведующая кафедрой истории музыки;</p>\
<p style="text-align: justify;"><strong>Сиднева</strong> Татьяна Борисовна, доктор культурологии, профессор, Нижегородская государственная консерватория им. М. И. Глинки (Нижний Новгород, Россия), проректор по научной работе, заведующая кафедрой философии и эстетики;</p>\
<p style="text-align: justify;"><strong>Фиденко</strong> Юлия Леонидовна, доктор искусствоведения, профессор, Дальневосточный государственный институт искусств (Владивосток, Россия), декан музыкального факультета, профессор кафедры истории музыки;</p>\
<p style="text-align: justify;"><strong>Чахвадзе</strong> Натэлла Владимировна, доктор искусствоведения, доцент, Магнитогорская государственная консерватория им. М. И. Глинки (Магнитогорск, Россия), профессор кафедры истории и теории музыки.</p>
editorial-ethics.header=Редакционная этика
editorial-ethics.main-text=<p style="text-align: justify;">«Научный вестник Уральской консерватории» базируется на современных юридических требованиях в отношении авторского права, законности, изложенных законодательстве РФ в отношении обеспечения авторского права и на этических принципах, декларируемых сообществом издателей научной периодики Committeeon Publication Ethics (COPE), и принципах, утвержденных Декларацией Ассоциации научных редакторов и издателей «Этические принципы научных публикаций».</p>\
<p style="text-align: justify;">Редакция несет ответственность за качество опубликованных научных статей и обеспечивает соблюдение публикационной этики членами редакционной коллегии, рецензентами и авторами. Не допускаются к публикации материалы, содержание которых запрещено законодательством РФ.</p>\
<p style="text-align: justify;">Сотрудники редакции обязаны:</p>\
  <ul style="list-style-type: disc;">\
<li style="text-align: justify;">быть беспристрастными, не оказывать предпочтение авторам в зависимости от пола, расы, религиозных убеждений, гражданства, этнической принадлежности, политических убеждений, должностного положения и иных условий, не имеющих отношения к научной ценности работы;</li>\
  <li style="text-align: justify;">не иметь конфликта интересов в отношении статей, которые они принимают или отвергают; </li>\
<li style="text-align: justify;">привлекать к рецензированию компетентных специалистов, использовать практику двойного (слепого) рецензирования;</li>\
<li style="text-align: justify;">хранить редакционную тайну, не разглашать персональные данные авторов и рецензентов;</li>\
<li style="text-align: justify;">добросовестно редактировать принятые к публикации тексты, согласовывать правку с авторами; </li>\
  <li style="text-align: justify;">предусмотреть возможность опубликования исправлений, разъяснений, опровержений и извинений в случае необходимости. </li>\
</ul>\
<p style="text-align: justify;">Авторы обязаны:</p>\
<ul>\
<li style="text-align: justify;">обеспечивать научную новизну и высокий научный уровень переданных в редакцию материалов;</li>\
<li style="text-align: justify;">гарантировать эксклюзивность предоставляемых материалов (статья не может быть ранее опубликована или предложена в другое издание);</li>\
<li style="text-align: justify;">указывать в качестве соавторов всех участников, внесших существенный вклад в исследование;</li>\
<li style="text-align: justify;">не допускать плагиата, оформлять ссылки на источники, обеспечивать точность цитирования;</li>\
  <li style="text-align: justify;">быть готовыми к сотрудничеству с редакцией на всех этапах работы с материалами;</li>\
<li style="text-align: justify;">указывать информацию о финансовых источниках поддержки отражаемых в материалах результатах исследования.</li>\
  </ul>\
<p style="text-align: justify;">Рецензенты обязаны:</p>\
<ul>\
<li style="text-align: justify;">быть беспристрастными, стремиться к объективности в оценке рецензируемых материалов, высказывать конструктивные замечания;</li>\
<li style="text-align: justify;">в случае недостаточной компетентности для объективной оценки полученных материалов сообщать об этом обстоятельстве;</li>\
<li style="text-align: justify;">соблюдать конфиденциальность экспертной оценки, не использовать информацию, полученную при рецензировании, в личных целях или в интересах иных лиц;</li>\
<li style="text-align: justify;">обеспечивать своевременность рецензирования.</li>\
</ul>
