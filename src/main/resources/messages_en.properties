editorial-board.header=Editorial board
editorial-board.main-text=<p style="text-align: justify;"><strong>Meshkova </strong>Anna Sergeevna,&nbsp;editor-in-chief, Ph. D. (Arts), Assistant professor, Ural State Conservatory named after M. P. Mussorgsky (Yekaterinburg, Russia);</p>\
<p style="text-align: justify;"><strong>Borodin</strong> Boris Borisovich, Doctor of Arts, Professor Ural State Conservatory named after M. P. Mussorgsky (Yekaterinburg, Russia), Head of the Department of History and Theory of Performing Arts;</p>\
<p style="text-align: justify;"><strong>Braginskaya</strong> Natalia Aleksandrovna, Ph. D. (Arts), Assistant professor, St. Petersburg State Conservatory named after N. A. Rimsky-Korsakov (St. Petersburg, Russia), Head of the Department of History of Foreign Music;</p>\
<p style="text-align: justify;"><strong>Valkova</strong> Vera Borisovna, Doctor of Arts, Professor, Gnesin Russian Academy of Music (Moscow, Russia), Professor at the Department of Music History;</p>\
<p style="text-align: justify;"><strong>Vlasova</strong> Ekaterina Sergeevna, Doctor of Arts, Professor, Moscow State Conservatory named after P. I. Tchaikovsky (Moscow, Russia), Professor at the Department of Russian Music History;</p>\
<p style="text-align: justify;"><strong>Girfanova</strong> Marina Evgenievna, Doctor of Arts, Professor, Kazan State Conservatory named after N. G. Zhiganov, Professor at the Department of Music Theory;</p>\
<p style="text-align: justify;"><strong>Gorodilova</strong> Marina Viktorovna, Ph. D. (Arts), Assistant professor, Ural State Conservatory named after M. P. Mussorgsky (Yekaterinburg, Russia), Professor at the Department of Music Theory;</p>\
<p style="text-align: justify;"><strong>Denisova-Bryuzhman</strong> Ekaterina Olegovna, Ph. D. (Arts), Doctor of Musicology, (Sorbonne University - Paris IV), Joint Association of Art Education (Auxerre, France), lecturer;</p>\
<p style="text-align: justify;"><strong>Kolarova-Gidishka</strong> Emilia Kristeva, Ph. D. (Arts), National Academy of Music named after Pancho Vladigerov (Sofia, Bulgaria), Professor of the Department of Music History and Ethnomusicology;</p>\
<p style="text-align: justify;"><strong>Korobova</strong> Alla Germanovna, Doctor of Arts, Professor, Ural State Conservatory named after M. P. Mussorgsky (Yekaterinburg, Russia), Professor at the Department of Music Theory;</p>\
<p style="text-align: justify;"><strong>Krylova</strong> Alexandra Vladimirovna, Doctor of Culturology, Professor S. V.&nbsp;Rachmaninoff Rostov State Conservatory (Rostov-on-Don, Russia), Vice-Rector for Research, Head of the Department of Performing Arts Production;</p>\
<p style="text-align: justify;"><strong>Mironenko</strong> Elena Sergeevna, Doctor of Arts and Culturology, Professor, Academy of Music, Theater and Fine Arts (Chisinau, Republic of Moldova), Head of the Music History Section at the Department of Musicology and Composition;</p>\
<p style="text-align: justify;"><strong>Pankina</strong> Elena Valerievna, Doctor of Arts, Assistant professor, Ural State Conservatory named after M. P. Mussorgsky (Yekaterinburg, Russia) Vice-Rector for Academic Affairs, Professor of the Department of Music History;</p>\
<p style="text-align: justify;"><strong>Serebryakova</strong> Lyubov Alekseevna, Ph. D. (Arts), Professor, Ural State Conservatory named after M. P. Mussorgsky (Yekaterinburg, Russia), Head of the Department of Music History;</p>\
<p style="text-align: justify;"><strong>Sidneva</strong> Tatiana Borisovna, Doctor of Culturology, Professor, Nizhny Novgorod State Conservatory named after M. I. Glinka (Nizhny Novgorod, Russia), Vice-Rector for Research, Head of the Department of Philosophy and Aesthetics;</p>\
<p style="text-align: justify;"><strong>Fidenko </strong>Yulia Leonidovna, Doctor of Arts, Professor, Far East State Academy of Arts (Vladivostok, Russia), Dean of the Faculty of Music, Professor of the Department of Music History;</p>\
<p style="text-align: justify;"><strong>Chakhvadze</strong> Natella Vladimirovna, Doctor of Arts, Assistant professor, Magnitogorsk State Conservatory named after M. I. Glinka (Magnitogorsk, Russia), Professor of the Department of History and Theory of Music.</p>
editorial-ethics.header=Editorial ethics
editorial-ethics.main-text=<p style="text-align: justify;">The editorial ethics of the Journal "Music in the System of Culture: Scientific Bulletin of the Ural Conservatory” based on modern legal requirements in relation to copyright, legality, set forth by the legislation of the Russian Federation in relation to copyright enforcement and on ethical principles declared by the community of publishers of scientific periodicals Committee on Publication Ethics (COPE ), and the principles approved by the Declaration of the Association of Science Editors and Publishers "Ethical Principles of Scientific Publications".</p>\
<p style="text-align: justify;">The editors is responsible for the quality of published scientific articles and ensures compliance with publication ethics by members of the editorial board, reviewers and authors. Materials, the content of which is prohibited by the legislation of the Russian Federation, shall not be allowed for publication.</p>\
<p style="text-align: justify;">Editorial staff shall be obliged to:</p>\
  <ul style="list-style-type: disc;">\
   <li style="text-align: justify;">to be impartial, not to give preference to authors depending on gender, race, religious beliefs, citizenship, ethnicity, political beliefs, official position and other conditions that have nothing to do with the scientific value of the work;</li>\
   <li style="text-align: justify;">have no conflict of interest in relation to the articles they accept or reject;</li>\
   <li style="text-align: justify;">involve competent specialists in reviewing, use the practice of double (blind) reviewing;</li>\
   <li style="text-align: justify;">keep editorial secrets, not to disclose personal data of authors and reviewers;</li>\
   <li style="text-align: justify;">edit the texts accepted for publication bona fide, coordinate the editing with the authors;</li>\
   <li style="text-align: justify;">provide for the possibility of publishing corrections, clarifications, refutations and apologies, if necessary.</li>\
  </ul>\
<p style="text-align: justify;">Authors are obliged to:</p>\
  <ul>\
  <li style="text-align: justify;">ensure scientific novelty and high scientific level of materials submitted to the editorial office;</li>\
  <li style="text-align: justify;">guarantee the exclusivity of the materials provided (the article cannot be previously published or offered to another publication);</li>\
  <li style="text-align: justify;">indicate as co-authors all participants who have made a significant contribution to the research;</li>\
  <li style="text-align: justify;">prevent plagiarism, provide links to sources, ensure the accuracy of citation;</li>\
  <li style="text-align: justify;">be ready to cooperate with the editors board at all stages of work with materials;</li>\
  <li style="text-align: justify;">indicate information about financial sources of support reflected in the materials of the research results.</li>\
  </ul>\
<p style="text-align: justify;">Reviewers are required to:</p>\
  <ul>\
  <li style="text-align: justify;">be impartial, strive for objectivity in assessing the reviewed materials, express constructive comments;\
  <li style="text-align: justify;">in case of insufficient competence for an objective assessment of the materials received, report this circumstance;\
  <li style="text-align: justify;">observe the confidentiality of the expert assessment, not use the information obtained during the review, for personal purposes or in the interests of other persons;\
  <li style="text-align: justify;">ensure the timeliness of the review.</li>\
</ul>
