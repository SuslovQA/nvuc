home.about-the-edition-text=<p><strong>"Music in the System of Culture: Scientific Bulletin of the Ural Conservatory"</strong> is a periodical printed edition that publishes scientific works of representatives of Russian conservatories and art universities.</p>\
  <p>The subject matter of the publication includes topical theoretical and historical problems of modern musicology, various aspects of performance, local musical history, folklore, spiritual and musical culture, music pedagogy, and the history of music education.</p>\
  <p>The journal has been published since 2005. In 2005–2011 it was published under the title "Music in the System of Culture". Since 2013 it has been published under the title "Music in the System of Culture: Scientific Bulletin of the Ural Conservatory”. The journal is included in the Russian Science Citation Index (RSCI).<p>
