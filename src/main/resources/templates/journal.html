<!DOCTYPE html>
<html lang="ru" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(#{head.main-title})}"></head>
<body>
<a class="skip-link" href="#main-content" th:text="#{accessibility.skip}"></a>
<header th:replace="~{fragments/site :: header}"></header>
<main id="main-content" class="container page-main">
    <article class="page-stack" aria-labelledby="journal-title">
        <div class="panel media-layout">
            <div class="main-cover current-issue-cover" th:if="${journal.cover != null}">
                <img class="latest-cover" th:src="@{/files/covers/{f}(f=${journal.cover})}" th:alt="${journalTitle ?: ''}">
            </div>
            <div class="panel-body prose">
                <h1 id="journal-title" class="page-title" th:text="${journalTitle}"></h1>
                <div class="issue-description" th:utext="${journalDescription}"></div>
                <a th:if="${pdfExist}" th:href="@{/files/pdf/{file}(file=${journal.pdf})}" target="_blank" rel="noopener noreferrer" class="main-btn" th:text="#{home.read}"></a>
                <p th:unless="${pdfExist}" class="no-pdf" th:text="#{journal.no-pdf}"></p>
            </div>
        </div>
        <section class="panel panel-body prose" aria-labelledby="contents-title">
            <h2 id="contents-title" class="page-title" th:text="#{journal.content}"></h2>
            <div th:utext="${journalContents}"></div>
        </section>
    </article>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
