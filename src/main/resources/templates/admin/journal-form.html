<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head(${journal.id == null ? 'Добавление журнала' : 'Редактирование журнала'}, true)}"></head>

<body>
<main class="container admin-main">

<a href="/admin" class="back">
    ← Назад
</a>

<h1 th:text="${journal.id == null
        ? 'Добавление журнала'
        : 'Редактирование журнала'}">
</h1>

<form th:action="${journal.id == null
        ? '/admin/journals'
        : '/admin/journals/' + journal.id}"
      th:object="${form}"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">


    <div class="form-group">

        <label for="year">
            Год
        </label>

        <input
                type="number"
                id="year"
                name="year"
                th:field="*{year}"
                min="2005"
                max="2099"
                required>

    </div>


    <div class="form-group">

        <label for="issue">
            Выпуск
        </label>

        <input
                type="text"
                id="issue"
                name="issue"
                th:field="*{issue}"
                required>

    </div>


    <div class="form-group">

        <label for="title">
            Название
        </label>

        <input
                type="text"
                id="title"
                name="title"
                th:field="*{title}"
                required>

    </div>


    <div class="form-group">

        <label for="titleEn">
            Название EN
        </label>

        <input
                type="text"
                id="titleEn"
                name="titleEn"
                th:field="*{titleEn}">

    </div>


    <div class="form-group">

        <span class="form-label" id="descriptionLabel">
            Описание
        </span>

        <div id="descriptionEditor"
             class="editor"
             th:utext="${@htmlSanitizerService.sanitize(form.description)}">
        </div>

        <input type="hidden"
               id="description"
               name="description" th:field="*{description}">

    </div>

    <div class="form-group">

        <span class="form-label" id="descriptionEnLabel">
            Описание EN
        </span>

        <div id="descriptionEnEditor"
             class="editor"
             th:utext="${@htmlSanitizerService.sanitize(form.descriptionEn)}">
        </div>

        <input type="hidden"
               id="descriptionEn"
               name="descriptionEn" th:field="*{descriptionEn}">

    </div>


    <div class="form-group">

        <span class="form-label" id="contentLabel">
            Содержание
        </span>

        <div id="contentEditor"
             class="editor"
             th:utext="${@htmlSanitizerService.sanitize(form.content)}">
        </div>

        <input type="hidden"
               id="content"
               name="content" th:field="*{content}">

    </div>


    <div class="form-group">

        <span class="form-label" id="contentEnLabel">
            Содержание EN
        </span>

        <div id="contentEnEditor"
             class="editor"
             th:utext="${@htmlSanitizerService.sanitize(form.contentEn)}">
        </div>

        <input type="hidden"
               id="contentEn"
               name="contentEn" th:field="*{contentEn}">

    </div>


    <div class="form-group">

        <label for="coverFile">
            Обложка
        </label>

        <input
                type="file"
                id="coverFile"
                name="coverFile"
                accept="image/jpeg,image/png,image/webp">

        <div class="file-info"
             th:if="${journal.cover != null}"
             th:text="'Текущая обложка: ' + ${journal.cover}">
        </div>

    </div>


    <div class="form-group">

        <label for="pdfFile">
            PDF файл
        </label>

        <input
                type="file"
                id="pdfFile"
                name="pdfFile"
                accept="application/pdf">

        <div class="file-info"
             th:if="${journal.pdf != null}"
             th:text="'Текущий PDF: ' + ${journal.pdf}">
        </div>

    </div>


    <div class="error" role="alert" th:if="${#fields.hasAnyErrors()}">
        <p>Исправьте ошибки и повторно выберите файлы, если они были прикреплены.</p>
        <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
    </div>
    <button type="submit" class="save-button">
        Сохранить
    </button>

</form>


</main>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js">
</script>


<script>

    const descriptionEditor =
        new Quill('#descriptionEditor', {
            theme: 'snow'
        });

    const descriptionEnEditor =
        new Quill('#descriptionEnEditor', {
            theme: 'snow'
        });

    const contentEditor =
        new Quill('#contentEditor', {
            theme: 'snow'
        });

    const contentEnEditor =
        new Quill('#contentEnEditor', {
            theme: 'snow'
        });


    // Compare editor state after initialization: Quill normalizes existing HTML on load.
    const editors = [descriptionEditor, descriptionEnEditor, contentEditor, contentEnEditor];
    const names = ['description', 'descriptionEn', 'content', 'contentEn'];
    const initialContents = editors.map(editor => JSON.stringify(editor.getContents()));

    editors.forEach((editor, index) => {
        editor.root.setAttribute('role', 'textbox');
        editor.root.setAttribute('aria-multiline', 'true');
        editor.root.setAttribute('aria-labelledby', names[index] + 'Label');
    });

    function contentsHtml(editor) {
        const container = document.createElement('div');
        container.innerHTML = editor.root.innerHTML;
        // Ordinary contents lines belong to one paragraph. Keep headings, lists,
        // and paragraphs with explicit block formatting intact.
        let paragraph = null;
        let firstMerge = true;
        Array.from(container.childNodes).forEach(node => {
            if (node.nodeName !== 'P' || node.attributes.length !== 0) {
                paragraph = null;
                return;
            }
            if (!paragraph) {
                paragraph = node;
                firstMerge = true;
                return;
            }
            if (firstMerge && paragraph.innerHTML === '<br>') paragraph.replaceChildren();
            firstMerge = false;
            paragraph.appendChild(document.createElement('br'));
            if (node.innerHTML !== '<br>') {
                while (node.firstChild) paragraph.appendChild(node.firstChild);
            }
            node.remove();
        });
        return container.innerHTML;
    }

    document.querySelector('form')
        .addEventListener('submit', function () {
            editors.forEach((editor, index) => {
                if (JSON.stringify(editor.getContents()) === initialContents[index]) return;
                document.getElementById(names[index]).value = index >= 2
                    ? contentsHtml(editor)
                    : editor.root.innerHTML;
            });
        });

</script>

</body>

</html>
