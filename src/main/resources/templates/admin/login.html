<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вход администратора</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet" href="/css/style_admin.css" th:href="@{/css/style_admin.css}">

</head>

<body>

<div class="login-container">

    <h1>Вход в панель администратора</h1>

    <form th:action="@{/admin/login}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">

            <label for="username">
                Логин
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username">

        </div>

        <div class="form-group">

            <label for="password">
                Пароль
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password">

        </div>

        <button type="submit">
            Войти
        </button>

    </form>

    <div th:if="${param.error}" class="error">
        Неверный логин или пароль
    </div>

    <div th:if="${param.logout}" class="success">
        Вы вышли из системы
    </div>

</div>

</body>
</html>
