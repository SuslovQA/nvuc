<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вход администратора</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="login-container">

    <h1>Вход в панель администратора</h1>

    <form th:action="@{/admin/login}"
          method="post">

        <!-- CSRF TOKEN -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">

            <label for="username">
                Логин
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username">

        </div>

        <div class="form-group">

            <label for="password">
                Пароль
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password">

        </div>

        <button type="submit">
            Войти
        </button>

    </form>

    <!-- Сообщение об ошибке -->
    <div th:if="${param.error}" class="error">
        Неверный логин или пароль
    </div>

    <!-- Сообщение после выхода -->
    <div th:if="${param.logout}" class="success">
        Вы вышли из системы
    </div>

</div>

</body>
</html>
