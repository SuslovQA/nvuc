<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head('Вход администратора', false)}"></head>

<body>

<main class="container container--narrow login-container panel panel-body">

    <h1 class="admin-header">Вход в панель администратора</h1>

    <form th:action="@{/admin/login}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">

            <label for="username">
                Логин
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username">

        </div>

        <div class="form-group">

            <label for="password">
                Пароль
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password">

        </div>

        <button type="submit" class="login-button">
            Войти
        </button>

    </form>

    <div th:if="${param.error}" class="error" role="alert">
        Неверный логин или пароль
    </div>

    <div th:if="${param.logout}" class="success" role="status">
        Вы вышли из системы
    </div>

</main>
</body>
</html>
