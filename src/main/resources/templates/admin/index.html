<!DOCTYPE html>

<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head('Административная панель', false)}"></head>

<body>
<main class="container admin-main">

<h1>
    Административная панель
</h1>

<a href="/admin/journals/new">
    + Добавить журнал
</a>

<div class="table-scroll" role="region" aria-label="Список журналов" tabindex="0">
<table>
    <caption class="visually-hidden">Журналы</caption>

    <thead>

    <tr>

        <th scope="col">ID</th>

        <th scope="col">Год</th>

        <th scope="col">Выпуск</th>

        <th scope="col">Название</th>

        <th scope="col">PDF</th>

        <th scope="col">Действия</th>

    </tr>

    </thead>


    <tbody>

    <tr th:each="journal : ${journals}">

        <td th:text="${journal.id}">
        </td>

        <td th:text="${journal.year}">
        </td>

        <td th:text="${journal.issue}">
        </td>

        <td th:text="${journal.title}">
        </td>

        <td>

            <span
                    th:if="${journal.pdf != null}">
                Есть
            </span>

            <span
                    th:unless="${journal.pdf != null}">
                Нет
            </span>

        </td>

        <td>

            <div class="actions">

                <a th:href="@{/admin/journals/{id}/edit(
                    id=${journal.id}
                )}">
                    Изменить
                </a>

                <form
                        th:action="@{/admin/journals/{id}/delete(
                            id=${journal.id}
                        )}"
                        method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            onclick="return confirm(
                                'Удалить журнал?'
                            )">

                        Удалить

                    </button>

                </form>

            </div>

        </td>

    </tr>

    </tbody>

</table>
</div>

<nav aria-label="Страницы журналов" th:if="${journalPage.totalPages > 1}">
    <a th:if="${journalPage.hasPrevious()}" th:href="@{/admin(page=${journalPage.number - 1})}">Назад</a>
    <span th:text="${journalPage.number + 1} + ' / ' + ${journalPage.totalPages}"></span>
    <a th:if="${journalPage.hasNext()}" th:href="@{/admin(page=${journalPage.number + 1})}">Далее</a>
</nav>


<form method="post"
      action="/admin/logout"
      class="logout-form">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <button type="submit" class="logout-button">
        Выйти
    </button>

</form>

</main>
</body>

</html>
