<!DOCTYPE html>

<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Административная панель</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #f5f5f5;
        }

        a,
        button {
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

    </style>

</head>

<body>

<h1>
    Административная панель
</h1>

<p>

    <a href="/admin/journals/new">
        + Добавить журнал
    </a>

</p>


<table>

    <thead>

    <tr>

        <th>ID</th>

        <th>Год</th>

        <th>Выпуск</th>

        <th>Название</th>

        <th>PDF</th>

        <th>Действия</th>

    </tr>

    </thead>


    <tbody>

    <tr th:each="journal : ${journals}">

        <td th:text="${journal.id}">
        </td>

        <td th:text="${journal.year}">
        </td>

        <td th:text="${journal.issue}">
        </td>

        <td th:text="${journal.title}">
        </td>

        <td>

            <span
                    th:if="${journal.pdf != null}">
                Есть
            </span>

            <span
                    th:unless="${journal.pdf != null}">
                Нет
            </span>

        </td>

        <td>

            <div class="actions">

                <a th:href="@{/admin/journals/{id}/edit(
                    id=${journal.id}
                )}">
                    Изменить
                </a>


                <form
                        th:action="@{/admin/journals/{id}/delete(
                            id=${journal.id}
                        )}"
                        method="post">

                    <button type="submit"
                            onclick="return confirm(
                                'Удалить журнал?'
                            )">

                        Удалить

                    </button>

                </form>

            </div>

        </td>

    </tr>

    </tbody>

</table>


<form method="post"
      action="/admin/logout">

    <button type="submit">
        Выйти
    </button>

</form>

</body>

</html>
