<!DOCTYPE html>

<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css/style_admin.css" th:href="@{/css/style_admin.css}">

    <title>Административная панель</title>

</head>

<body>

<h1>
    Административная панель
</h1>

<p>

    <a href="/admin/journals/new">
        + Добавить журнал
    </a>

</p>


<table>

    <thead>

    <tr>

        <th>ID</th>

        <th>Год</th>

        <th>Выпуск</th>

        <th>Название</th>

        <th>PDF</th>

        <th>Действия</th>

    </tr>

    </thead>


    <tbody>

    <tr th:each="journal : ${journals}">

        <td th:text="${journal.id}">
        </td>

        <td th:text="${journal.year}">
        </td>

        <td th:text="${journal.issue}">
        </td>

        <td th:text="${journal.title}">
        </td>

        <td>

            <span
                    th:if="${journal.pdf != null}">
                Есть
            </span>

            <span
                    th:unless="${journal.pdf != null}">
                Нет
            </span>

        </td>

        <td>

            <div class="actions">

                <a th:href="@{/admin/journals/{id}/edit(
                    id=${journal.id}
                )}">
                    Изменить
                </a>


                <form
                        th:action="@{/admin/journals/{id}/delete(
                            id=${journal.id}
                        )}"
                        method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            onclick="return confirm(
                                'Удалить журнал?'
                            )">

                        Удалить

                    </button>

                </form>

            </div>

        </td>

    </tr>

    </tbody>

</table>


<form method="post"
      action="/admin/logout"
      class="logout-form">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <button type="submit" class="logout-button">
        Выйти
    </button>

</form>

</body>

</html>
