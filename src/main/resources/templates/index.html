<!DOCTYPE html>
<html lang="ru" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(#{head.main-title})}"></head>
<body>
<a class="skip-link" href="#main-content" th:text="#{accessibility.skip}"></a>
<header th:replace="~{fragments/site :: header}"></header>
<main id="main-content" class="container page-main page-stack">
    <h1 class="visually-hidden" th:text="#{head.main-title}"></h1>
    <section class="panel media-layout" th:aria-label="#{menu.about}">
        <div class="main-cover">
            <img th:src="@{/images/main_page_image.jpg}" th:alt="#{head.main-title}">
        </div>
        <div class="main-text">
            <div class="prose" th:utext="#{home.about-the-edition-text}"></div>
            <a class="main-btn" th:href="@{/about}" th:text="#{home.about-the-edition-button}"></a>
        </div>
    </section>
    <section class="panel" aria-labelledby="current-issue-title">
        <h2 id="current-issue-title" class="panel-title" th:text="#{home.current-issue-header}"></h2>
        <p class="panel-body" th:if="${latestJournal == null}" th:text="#{home.no-issues}"></p>
        <article class="media-layout" th:if="${latestJournal != null}" aria-labelledby="latest-title">
            <div class="main-cover current-issue-cover" th:if="${latestJournal.cover != null}">
                <img class="latest-cover" th:src="@{/files/covers/{f}(f=${latestJournal.cover})}" th:alt="${latestTitle ?: ''}">
            </div>
            <div class="panel-body current-issue-data prose">
                <h3 id="latest-title" th:text="${latestTitle}"></h3>
                <div th:utext="${latestDescription}"></div>
                <h4 th:text="#{journal.content}"></h4>
                <div th:utext="${latestContents}"></div>
                <a class="main-btn" th:if="${latestJournal.pdf != null}" th:href="@{/files/pdf/{file}(file=${latestJournal.pdf})}" target="_blank" rel="noopener noreferrer" th:text="#{home.read}"></a>
            </div>
        </article>
    </section>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
